<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="font-family: Georgia, 'Palatino Linotype', 'DejaVu Serif', serif;">
  <defs>
    <linearGradient id="deepSea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16425b"/>
      <stop offset="55%" stop-color="#12394f"/>
      <stop offset="100%" stop-color="#0c2839"/>
    </linearGradient>
    <linearGradient id="landmass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe0bd"/>
      <stop offset="55%" stop-color="#e3cb9c"/>
      <stop offset="100%" stop-color="#d3b47e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04121c" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="swell" width="46" height="22" patternUnits="userSpaceOnUse">
      <path d="M 0 11 Q 11 6, 23 11 T 46 11" fill="none" stroke="#7fa8b5" stroke-width="0.9" opacity="0.5"/>
    </pattern>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.6" fill="#8a6f45" opacity="0.35"/>
      <circle cx="5" cy="6" r="0.5" fill="#8a6f45" opacity="0.3"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffd97a" flood-opacity="0.8"/>
    </filter>
    <clipPath id="landClip">
      <path d="M 220,0 Q 280,60 380,50 Q 520,30 680,60 Q 820,40 1000,80 Q 1120,140 1200,200 L 1200,280 Q 1160,320 1120,440 Q 1060,580 980,680 Q 900,780 850,900 L 450,900 Q 360,820 300,750 Q 240,660 200,560 Q 140,420 180,300 Q 200,180 220,0 Z"/>
    </clipPath>
    <g id="pine">
      <polygon points="0,-11 6,-1 3,-1 8,7 2,7 2,12 -2,12 -2,7 -8,7 -3,-1 -6,-1" fill="#1e4d38"/>
    </g>
    <g id="peak">
      <polygon points="0,-16 11,8 -11,8" fill="#5d4a36"/>
      <polygon points="0,-16 5.5,-6 -5.5,-6" fill="#f4efe2"/>
      <polygon points="0,-16 11,8 -11,8" fill="none" stroke="#2e2117" stroke-width="1.4"/>
    </g>
  </defs>

  <!-- Abyssal sea -->
  <rect width="1200" height="900" fill="url(#deepSea)"/>
  <rect width="1200" height="900" fill="url(#swell)" opacity="0.5"/>

  <!-- Faint graticule over water -->
  <g stroke="#8fb3bf" stroke-width="0.6" opacity="0.22">
    <path d="M 0,150 L 1200,150 M 0,300 L 1200,300 M 0,450 L 1200,450 M 0,600 L 1200,600 M 0,750 L 1200,750"/>
    <path d="M 150,0 L 150,900 M 300,0 L 300,900 M 450,0 L 450,900 M 600,0 L 600,900 M 750,0 L 750,900 M 900,0 L 900,900 M 1050,0 L 1050,900"/>
  </g>

  <!-- Depth contours echoing the coast -->
  <g fill="none" stroke="#9fc3cf" opacity="0.28">
    <path d="M 0,0 L 220,0 Q 200,180 180,300 Q 140,420 200,560 Q 240,660 300,750 Q 360,820 450,900 L 0,900 Z" stroke-width="1.2"/>
    <path d="M 850,900 Q 900,780 980,680 Q 1060,580 1120,440 Q 1160,320 1200,280 L 1200,900 Z" stroke-width="1.2"/>
  </g>
  <g fill="none" stroke="#9fc3cf" opacity="0.14">
    <path d="M 0,0 L 190,0 Q 170,180 150,300 Q 112,420 172,560 Q 212,660 272,750 Q 332,820 420,900 L 0,900 Z" stroke-width="1"/>
    <path d="M 880,900 Q 928,780 1006,680 Q 1084,580 1142,440 Q 1180,320 1200,300 L 1200,900 Z" stroke-width="1"/>
  </g>

  <!-- Sea labels -->
  <text x="72" y="540" font-size="19" fill="#cfe3ea" font-style="italic" letter-spacing="5" opacity="0.85" transform="rotate(-70 72 540)">THE SUNDERSEA</text>
  <text x="1052" y="640" font-size="17" fill="#cfe3ea" font-style="italic" letter-spacing="3" opacity="0.85" transform="rotate(48 1052 640)">MERIDIAN GULF</text>
  <text x="420" y="60" font-size="13" fill="#9dc0cc" font-style="italic" letter-spacing="3" opacity="0.7">THE NORTHERN RIFTLANDS</text>

  <!-- Continent -->
  <path d="M 228,8 Q 288,68 388,58 Q 528,38 688,68 Q 828,48 1008,88 Q 1128,148 1200,208 L 1200,280 Q 1168,328 1128,448 Q 1068,588 988,688 Q 908,788 858,900 L 458,900 Q 368,828 308,758 Q 248,668 208,568 Q 148,428 188,308 Q 208,188 228,8 Z" fill="#03141d" opacity="0.5"/>
  <path d="M 220,0 Q 280,60 380,50 Q 520,30 680,60 Q 820,40 1000,80 Q 1120,140 1200,200 L 1200,280 Q 1160,320 1120,440 Q 1060,580 980,680 Q 900,780 850,900 L 450,900 Q 360,820 300,750 Q 240,660 200,560 Q 140,420 180,300 Q 200,180 220,0 Z"
        fill="url(#landmass)"/>
  <g clip-path="url(#landClip)">
    <rect x="150" y="0" width="1100" height="900" fill="url(#grain)"/>
    <g stroke="#b99c66" stroke-width="0.7" opacity="0.35">
      <path d="M 150,180 L 1250,180 M 150,360 L 1250,360 M 150,540 L 1250,540 M 150,720 L 1250,720"/>
      <path d="M 350,0 L 350,900 M 550,0 L 550,900 M 750,0 L 750,900 M 950,0 L 950,900"/>
    </g>
  </g>
  <path d="M 220,0 Q 280,60 380,50 Q 520,30 680,60 Q 820,40 1000,80 Q 1120,140 1200,200 L 1200,280 Q 1160,320 1120,440 Q 1060,580 980,680 Q 900,780 850,900 L 450,900 Q 360,820 300,750 Q 240,660 200,560 Q 140,420 180,300 Q 200,180 220,0 Z"
        fill="none" stroke="#f7ecd0" stroke-width="7" opacity="0.45"/>
  <path d="M 220,0 Q 280,60 380,50 Q 520,30 680,60 Q 820,40 1000,80 Q 1120,140 1200,200 L 1200,280 Q 1160,320 1120,440 Q 1060,580 980,680 Q 900,780 850,900 L 450,900 Q 360,820 300,750 Q 240,660 200,560 Q 140,420 180,300 Q 200,180 220,0 Z"
        fill="none" stroke="#3a2a18" stroke-width="2.6"/>

  <!-- Nation tints + dashed marches -->
  <path d="M 220,0 Q 320,80 340,240 Q 350,340 420,380 Q 320,440 200,420 Q 180,300 220,0 Z" fill="#2e6f9e" opacity="0.10"/>
  <path d="M 220,0 Q 320,80 340,240 Q 350,340 420,380 Q 320,440 200,420" fill="none" stroke="#2e6f9e" stroke-width="1.4" stroke-dasharray="7,4" opacity="0.7"/>
  <path d="M 680,60 Q 820,40 1000,80 Q 1120,140 1160,300 Q 1080,420 950,420 Q 820,400 700,320 Q 640,180 680,60 Z" fill="#c48a32" opacity="0.12"/>
  <path d="M 1160,300 Q 1080,420 950,420 Q 820,400 700,320" fill="none" stroke="#a86f24" stroke-width="1.4" stroke-dasharray="7,4" opacity="0.7"/>
  <path d="M 420,380 Q 580,360 700,420 Q 760,540 720,660 Q 580,720 440,660 Q 380,520 420,380 Z" fill="#1e6b45" opacity="0.13"/>
  <path d="M 420,380 Q 580,360 700,420 Q 760,540 720,660 Q 580,720 440,660 Q 380,520 420,380 Z" fill="none" stroke="#1e6b45" stroke-width="1.4" stroke-dasharray="7,4" opacity="0.7"/>
  <path d="M 440,660 Q 580,720 720,660 Q 780,740 850,900 L 450,900 Q 380,800 440,660 Z" fill="#a05c3a" opacity="0.12"/>
  <path d="M 440,660 Q 580,720 720,660" fill="none" stroke="#a05c3a" stroke-width="1.4" stroke-dasharray="7,4" opacity="0.7"/>
  <path d="M 720,660 Q 820,560 950,560 Q 980,680 900,780 Q 820,740 720,660 Z" fill="#274b73" opacity="0.12"/>
  <path d="M 720,660 Q 820,560 950,560 Q 980,680 900,780" fill="none" stroke="#274b73" stroke-width="1.4" stroke-dasharray="7,4" opacity="0.7"/>

  <!-- Rivers -->
  <g fill="none" stroke-linecap="round">
    <path d="M 520,280 Q 440,260 380,220 Q 320,180 270,140 Q 230,120 195,110" stroke="#3f7d99" stroke-width="3.2"/>
    <path d="M 460,340 Q 420,300 380,220" stroke="#3f7d99" stroke-width="1.8"/>
  </g>
  <text x="318" y="158" font-size="11" fill="#2c5a72" font-style="italic" transform="rotate(-28 318 158)">River Ilya</text>

  <!-- Silver Horns -->
  <g>
    <use href="#peak" x="505" y="80"/><use href="#peak" x="558" y="66"/><use href="#peak" x="612" y="78"/><use href="#peak" x="666" y="68"/>
    <text x="585" y="30" font-size="13" fill="#3a2a1d" font-weight="bold" letter-spacing="2" text-anchor="middle">THE SILVER HORNS</text>
  </g>
  <!-- Spine of Thaeron -->
  <g>
    <use href="#peak" x="258" y="300"/><use href="#peak" x="272" y="372"/><use href="#peak" x="284" y="448"/>
    <text x="196" y="440" font-size="12" fill="#3a2a1d" font-weight="bold" letter-spacing="1" transform="rotate(-75 196 440)" text-anchor="middle">SPINE OF THAERON</text>
  </g>
  <!-- Weeping Ridge -->
  <g opacity="0.95">
    <use href="#peak" x="528" y="262"/><use href="#peak" x="578" y="278"/><use href="#peak" x="628" y="296"/><use href="#peak" x="676" y="314"/>
    <ellipse cx="600" cy="285" rx="110" ry="34" fill="#cfd6da" opacity="0.35"/>
    <text x="600" y="208" font-size="13" fill="#3a2a1d" font-weight="bold" letter-spacing="2" text-anchor="middle">THE WEEPING RIDGE</text>
  </g>

  <!-- Verdancy canopy -->
  <g opacity="0.85">
    <use href="#pine" x="480" y="480"/><use href="#pine" x="512" y="468"/><use href="#pine" x="544" y="488"/>
    <use href="#pine" x="582" y="462"/><use href="#pine" x="620" y="480"/><use href="#pine" x="652" y="468"/>
    <use href="#pine" x="462" y="532"/><use href="#pine" x="502" y="542"/><use href="#pine" x="552" y="532"/>
    <use href="#pine" x="602" y="542"/><use href="#pine" x="642" y="530"/><use href="#pine" x="682" y="510"/>
    <use href="#pine" x="492" y="600"/><use href="#pine" x="542" y="610"/><use href="#pine" x="592" y="600"/><use href="#pine" x="642" y="590"/>
    <text x="566" y="570" font-size="16" fill="#173d2b" font-weight="bold" letter-spacing="4" text-anchor="middle">THE VERDANCY</text>
  </g>

  <!-- Crater of Avarr -->
  <ellipse cx="648" cy="382" rx="36" ry="20" fill="#241d16" opacity="0.32" stroke="#171310" stroke-width="1.5" stroke-dasharray="4,3"/>
  <ellipse cx="648" cy="382" rx="22" ry="11" fill="#000" opacity="0.3"/>
  <text x="648" y="416" font-size="10" fill="#4a3a28" font-style="italic" text-anchor="middle">Crater of Avarr [16]</text>

  <!-- Vareth dune ripples -->
  <g stroke="#8a4f28" stroke-width="1" fill="none" opacity="0.55">
    <path d="M 480,720 Q 510,715 540,720"/><path d="M 560,740 Q 600,735 640,740"/>
    <path d="M 660,720 Q 700,715 740,720"/><path d="M 520,780 Q 560,775 600,780"/>
    <path d="M 640,800 Q 680,795 720,800"/>
    <text x="600" y="852" font-size="16" fill="#6e3f1c" font-weight="bold" letter-spacing="4" text-anchor="middle" stroke="none">DOMINION OF VARETH</text>
  </g>

  <!-- Star Roads -->
  <g fill="none" stroke="#37e0c8" stroke-width="2.6" stroke-dasharray="8,6" opacity="0.8">
    <path d="M 880,730 Q 750,560 620,440 Q 585,320 570,90"/>
    <path d="M 280,180 Q 420,260 620,440 Q 700,600 680,780"/>
  </g>
  <text x="740" y="500" font-size="10" fill="#0e5f54" font-weight="bold" transform="rotate(-40 740 500)">── THE STAR ROADS ──</text>

  <!-- Overland highways -->
  <g fill="none" stroke="#6e4f2a" stroke-width="1.8" stroke-dasharray="5,3" opacity="0.85">
    <path d="M 280,180 Q 500,160 880,240"/>
    <path d="M 880,240 Q 940,460 880,730"/>
    <path d="M 880,730 Q 780,750 680,780"/>
  </g>

  <!-- Realm banners -->
  <text x="205" y="248" font-size="16" font-weight="bold" fill="#1e4256" letter-spacing="3">REPUBLIC OF ILYA</text>
  <text x="858" y="182" font-size="16" font-weight="bold" fill="#7a4d12" letter-spacing="3">AURELIAN LEAGUE</text>
  <text x="838" y="658" font-size="15" font-weight="bold" fill="#163850" letter-spacing="2">THE FREE COAST</text>

  <!-- Keyed sites -->
  <g font-weight="bold">
    <circle cx="880" cy="730" r="7" fill="#c1121f" stroke="#fff" stroke-width="2"/>
    <text x="895" y="735" font-size="14" fill="#8d0808">PORT MERIDIAN [01]</text>
    <text x="895" y="750" font-size="10" font-weight="normal" fill="#4a3436">Shattered Archive [02]</text>
    <circle cx="940" cy="790" r="4" fill="#274b73" stroke="#fff" stroke-width="1.5"/>
    <text x="950" y="805" font-size="10" font-weight="normal" font-style="italic" fill="#163850">Shattered Reefs [17]</text>
    <circle cx="280" cy="180" r="7" fill="#274b73" stroke="#fff" stroke-width="2"/>
    <text x="180" y="175" font-size="14" fill="#0b2a4a">NEW ILYA [03]</text>
    <text x="175" y="190" font-size="10" font-weight="normal" fill="#4a4a4a">Athenaeum Null [04]</text>
    <circle cx="880" cy="240" r="7" fill="#b07d62" stroke="#fff" stroke-width="2"/>
    <text x="895" y="245" font-size="14" fill="#6e3f1c">SOLCARIS NOVA [09]</text>
    <circle cx="980" cy="290" r="5" fill="#6c757d" stroke="#fff" stroke-width="1.5"/>
    <text x="995" y="295" font-size="10" font-weight="normal" fill="#3d434b">Solcaris Ruins [10]</text>
    <circle cx="270" cy="360" r="5" fill="#495057" stroke="#fff" stroke-width="1.5"/>
    <text x="168" y="352" font-size="11" fill="#1c1f24">Harad Veyr [11]</text>
    <circle cx="570" cy="240" r="6" fill="#e9c46a" stroke="#264653" stroke-width="2"/>
    <text x="585" y="235" font-size="12" fill="#7a5a20">Lantern Chapel [05]</text>
    <text x="585" y="250" font-size="9" font-weight="normal" fill="#5c5c5c">Whispering Crags [06]</text>
    <circle cx="540" cy="320" r="5" fill="#588157" stroke="#fff" stroke-width="1.5"/>
    <text x="495" y="348" font-size="11" fill="#2c4a34">Vale Myrr [13]</text>
    <circle cx="570" cy="90" r="6" fill="#90e0ef" stroke="#0077b6" stroke-width="1.5"/>
    <text x="585" y="95" font-size="11" fill="#0a5a86">Nythara [12]</text>
    <circle cx="530" cy="510" r="6" fill="#2d6a4f" stroke="#fff" stroke-width="2"/>
    <text x="545" y="515" font-size="12" fill="#173d2b">Living Spires [14]</text>
    <circle cx="630" cy="580" r="4" fill="#40916c" stroke="#fff" stroke-width="1"/>
    <text x="640" y="585" font-size="10" font-weight="normal" font-style="italic" fill="#1e4d38">Hollow Glades [15]</text>
    <circle cx="680" cy="780" r="7" fill="#212529" stroke="#fff" stroke-width="2"/>
    <text x="695" y="785" font-size="14" fill="#101418">KHAR VARETH [07]</text>
    <text x="695" y="800" font-size="10" font-weight="normal" fill="#3d3d3d">Bleak Path Threshold [08]</text>
    <g transform="translate(620, 440)">
      <polygon points="0,-12 10,6 -10,6" fill="#7b2cbf" stroke="#fff" stroke-width="1.5"/>
      <text x="15" y="2" font-size="12" fill="#3d0a63">Engine Deep [19]</text>
      <text x="15" y="16" font-size="10" font-weight="normal" fill="#5a189a">The Open Veil [20]</text>
    </g>
  </g>

  <!-- Title cartouche -->
  <g transform="translate(36, 36)">
    <rect width="372" height="96" rx="6" fill="#0e2233" stroke="#c9a227" stroke-width="2.5"/>
    <rect x="6" y="6" width="360" height="84" rx="3" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.6"/>
    <text x="186" y="42" font-size="26" font-weight="bold" fill="#e8c766" text-anchor="middle" letter-spacing="6">ELONIA</text>
    <line x1="46" y1="52" x2="326" y2="52" stroke="#c9a227" stroke-width="1" opacity="0.7"/>
    <text x="186" y="69" font-size="11" fill="#d9c58a" text-anchor="middle" letter-spacing="1">THE CONTINENT IN THE THOUSANDTH YEAR</text>
    <text x="186" y="83" font-size="9" fill="#9db4c0" text-anchor="middle" font-style="italic">After the Great Silence • c. 1,000 AS</text>
  </g>

  <!-- Compass rose -->
  <g transform="translate(1082, 112)">
    <circle r="46" fill="#0e2233" stroke="#c9a227" stroke-width="2"/>
    <circle r="40" fill="none" stroke="#c9a227" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.7"/>
    <polygon points="0,-48 7,-10 0,0 -7,-10" fill="#e8c766"/>
    <polygon points="0,48 7,10 0,0 -7,10" fill="#5c6b78"/>
    <polygon points="48,0 10,7 0,0 10,-7" fill="#5c6b78"/>
    <polygon points="-48,0 -10,7 0,0 -10,-7" fill="#5c6b78"/>
    <polygon points="28,-28 7,-5 0,0 5,-7" fill="#8a743f"/>
    <polygon points="28,28 7,5 0,0 5,7" fill="#8a743f"/>
    <polygon points="-28,28 -7,5 0,0 -5,7" fill="#8a743f"/>
    <polygon points="-28,-28 -7,-5 0,0 -5,-7" fill="#8a743f"/>
    <text x="-5" y="-53" font-size="14" font-weight="bold" fill="#e8c766">N</text>
    <text x="-4" y="64" font-size="12" fill="#9db4c0">S</text>
    <text x="53" y="4" font-size="12" fill="#9db4c0">E</text>
    <text x="-66" y="4" font-size="12" fill="#9db4c0">W</text>
  </g>

  <!-- Legend -->
  <g transform="translate(36, 742)">
    <rect width="262" height="128" rx="5" fill="#0e2233" stroke="#c9a227" stroke-width="2"/>
    <text x="15" y="24" font-size="12" font-weight="bold" fill="#e8c766" letter-spacing="2">MAP LEGEND</text>
    <line x1="15" y1="30" x2="247" y2="30" stroke="#c9a227" stroke-width="0.8" opacity="0.6"/>
    <circle cx="25" cy="47" r="5" fill="#c1121f" stroke="#fff" stroke-width="1"/>
    <text x="40" y="51" font-size="11" fill="#e6ddc8">Major Sovereign Capital</text>
    <circle cx="25" cy="68" r="4" fill="#8a8f96" stroke="#fff" stroke-width="1"/>
    <text x="40" y="72" font-size="11" fill="#e6ddc8">Pre-Silence Ruin</text>
    <line x1="18" y1="88" x2="32" y2="88" stroke="#37e0c8" stroke-width="2.4" stroke-dasharray="4,2"/>
    <text x="40" y="92" font-size="11" fill="#e6ddc8">Star Road (dormant)</text>
    <line x1="18" y1="108" x2="32" y2="108" stroke="#c9a877" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="40" y="112" font-size="11" fill="#e6ddc8">Imperial Highway</text>
  </g>

  <!-- Scale bar: ~2000 miles N-S over ~880 map units -->
  <g transform="translate(902, 852)">
    <rect x="-8" y="-26" width="262" height="52" rx="5" fill="#0e2233" stroke="#c9a227" stroke-width="2"/>
    <rect x="0" y="0" width="60" height="7" fill="#e6ddc8"/>
    <rect x="60" y="0" width="60" height="7" fill="#3a3a3a"/>
    <rect x="120" y="0" width="60" height="7" fill="#e6ddc8"/>
    <rect x="180" y="0" width="60" height="7" fill="#3a3a3a"/>
    <text x="0" y="22" font-size="10" fill="#e6ddc8">0</text>
    <text x="55" y="22" font-size="10" fill="#e6ddc8">150</text>
    <text x="112" y="22" font-size="10" fill="#e6ddc8">300</text>
    <text x="172" y="22" font-size="10" fill="#e6ddc8">450</text>
    <text x="222" y="22" font-size="10" fill="#e6ddc8">600 mi</text>
  </g>

  <!-- Vignette + frame -->
  <rect width="1200" height="900" fill="url(#vignette)"/>
  <rect x="14" y="14" width="1172" height="872" fill="none" stroke="#c9a227" stroke-width="3"/>
  <rect x="22" y="22" width="1156" height="856" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.6"/>
</svg>
